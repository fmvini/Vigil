name: Vigil web and schedule verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.repository.visibility == 'public' &&
      github.event.repository.fork == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify schedule contract without production secrets
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace
          node:24-alpine node --test infra/check-schedule/worker.test.mjs
      - name: Run official frontend tests and build on Linux
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE/frontend:/frontend" -w /frontend
          node:24-alpine sh -c
          'npm ci --no-audit --no-fund && npm test && npm run build'
