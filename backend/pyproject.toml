[project]
name = "vigil-backend"
version = "0.1.0"
description = "Vigil HTTP monitoring API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.142.2",
  "sqlalchemy[asyncio]==2.0.54",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "asyncpg==0.31.0",
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "uvicorn==0.54.0",
  "email-validator==2.3.0",
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "certifi==2026.7.22",
  "anyio==4.15.1",
  "taskiq==0.13.0",
  "taskiq-redis==1.2.4",
  "redis==8.1.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "aiosqlite==0.22.1",
  "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: requires an isolated PostgreSQL test database", "redis: requires real Redis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
